groups:
  - name: lumina-api
    rules:
      - alert: LuminaApiDown
        expr: up{job="lumina-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: LuminaSQL API target is down
          description: Prometheus has not scraped {{ $labels.instance }} for over 1 minute.

      - alert: LuminaHighHttpErrorRate
        expr: |
          sum(rate(lumina_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(lumina_http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of API requests are failing
          description: 5xx ratio is {{ $value | humanizePercentage }} over the last 5 minutes.

  - name: lumina-agent
    rules:
      - alert: LuminaAgentFailureRateHigh
        expr: |
          sum(rate(lumina_agent_runs_total{outcome="failed"}[15m]))
            / clamp_min(sum(rate(lumina_agent_runs_total[15m])), 1e-9) > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Agent fails to produce a working query for more than 30% of questions
          description: Failure ratio is {{ $value | humanizePercentage }}; check the LLM provider and schema drift.

      - alert: LuminaAgentLatencyP95High
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(lumina_agent_run_duration_seconds_bucket[5m]))) > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Agent p95 latency above 20s
          description: p95 end-to-end agent latency is {{ $value | humanizeDuration }}.

      - alert: LuminaSelfCorrectionSpike
        expr: |
          sum(rate(lumina_agent_execution_attempts_sum[30m]))
            / clamp_min(sum(rate(lumina_agent_execution_attempts_count[30m])), 1e-9) > 1.5
        for: 15m
        labels:
          severity: info
        annotations:
          summary: Queries need unusually many self-correction retries
          description: Average execution attempts per run is {{ $value }}; a schema change or model regression is likely.

      - alert: LuminaLlmErrors
        expr: sum(rate(lumina_llm_calls_total{status="error"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: LLM provider calls are failing
          description: "{{ $value }} LLM errors per second over the last 5 minutes."

  - name: lumina-safety
    rules:
      - alert: LuminaValidatorBypass
        expr: sum(increase(lumina_unsafe_query_rejections_total{layer="database"}[10m])) > 0
        labels:
          severity: critical
        annotations:
          summary: The database refused a query that passed the SQL validator
          description: >-
            The read-only role or read-only transaction blocked a statement the AST guard
            accepted. Defense in depth held, but the guard has a gap; find the query by request_id
            in the logs and add it to eval/datasets/adversarial_sql.jsonl.

      - alert: LuminaUnsafeQuerySpike
        expr: sum(rate(lumina_unsafe_query_rejections_total[15m])) * 900 > 20
        for: 15m
        labels:
          severity: info
        annotations:
          summary: Unusually many unsafe queries rejected
          description: More than 20 unsafe queries per 15 minutes; possible prompt-injection probing.

  - name: lumina-capacity
    rules:
      - alert: LuminaLoadShedding
        expr: |
          sum(rate(lumina_admission_rejections_total{reason=~"queue_full|queue_timeout"}[5m]))
            / clamp_min(sum(rate(lumina_http_requests_total{route=~"/api/v1/query.*"}[5m])), 1e-9) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Admission control is shedding more than 5% of query requests
          description: Shed ratio {{ $value | humanizePercentage }}; scale out replicas (limits are per replica).

      - alert: LuminaAdmissionQueueWaitHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(lumina_admission_wait_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Requests wait more than 2s (p95) for an execution slot
          description: Replicas are at their concurrency limit; latency is dominated by queueing.

  - name: lumina-llm
    rules:
      - alert: LuminaLlmRateLimited
        expr: sum(rate(lumina_agent_run_failures_total{category="RATE_LIMIT"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Requests are failing because the LLM provider is rate limiting
          description: Raise the provider quota or lower MAX_CONCURRENT_REQUESTS across replicas.

      - alert: LuminaLlmSpendHigh
        expr: sum(increase(lumina_llm_estimated_cost_usd_total[1h])) > 5
        for: 15m
        labels:
          severity: info
        annotations:
          summary: Estimated LLM spend above $5/hour
          description: "Estimated spend {{ $value | printf \"%.2f\" }} USD over the last hour (adjust the threshold per deployment)."

  - name: lumina-dependencies
    rules:
      - alert: LuminaSchemaUnavailable
        expr: sum(rate(lumina_agent_run_failures_total{category=~"SCHEMA_UNAVAILABLE|CONNECTION_ERROR"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Requests are failing because the database is unreachable
          description: Check PostgreSQL availability and the connection pool (POSTGRES_POOL_* settings).

      - alert: LuminaCacheUnavailable
        expr: sum(rate(lumina_cache_requests_total{result="error"}[5m])) > 0
        for: 5m
        labels:
          severity: info
        annotations:
          summary: Redis cache is unavailable; serving without cache
          description: Requests still succeed, but every question now calls the LLM.

      - alert: LuminaDbLatencyP95High
        expr: |
          histogram_quantile(0.95, sum by (le, backend) (rate(lumina_db_query_duration_seconds_bucket[5m]))) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Database query p95 latency above 5s on {{ $labels.backend }}
          description: Generated queries may be missing indexes or scanning large tables.
