name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Everything here is deterministic and needs no LLM key. The paid real-model evaluation
# lives in model-eval.yml and only runs on manual dispatch.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.8.0"
      - run: ruff check .
      - run: ruff format --check .

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q --cov=src --cov=api --cov=eval --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: SQL guard unit and adversarial tests
        run: pytest -q tests/test_sql_guard.py tests/test_failures.py
      - name: Guard suite (fails on any unrejected payload or gold false positive)
        run: python scripts/run_eval.py guard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guard-report
          path: eval/results/guard-*.json

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lumina
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lumina"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      dynamodb-local:
        image: amazon/dynamodb-local:2.5.3
        ports: ["8000:8000"]
    env:
      LUMINA_INTEGRATION: "1"
      DYNAMODB_ENDPOINT_URL: http://localhost:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
      POSTGRES_HOST: localhost
      # The application connects as the least-privilege role, exactly as in Compose and k8s.
      POSTGRES_USER: lumina_reader
      POSTGRES_PASSWORD: lumina_reader
      REDIS_URL: redis://localhost:6379/0
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Seed database and roles (as superuser)
        run: |
          for f in db/init/*.sql; do
            psql -h localhost -U postgres -d lumina -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - run: pytest -q -m integration
      - name: Gold SQL executes and returns rows
        run: python scripts/run_eval.py validate-gold
      - name: Scripted failure-mode suite (simulated LLM, real Postgres)
        run: python scripts/run_eval.py scripted
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scripted-eval-report
          path: eval/results/scripted-*

  config-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Prometheus config and alert rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/observability/prometheus:/etc/prometheus" \
            prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml
      - name: Validate Grafana dashboard JSON
        run: python -m json.tool observability/grafana/dashboards/lumina.json > /dev/null
      - name: Validate docker-compose
        run: docker compose --profile loadtest --profile observability config --quiet

  container-e2e:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres, Redis, mock LLM, and the API
        run: |
          docker compose build api
          docker compose --profile loadtest up -d postgres redis mock-llm api-loadtest
          for i in $(seq 1 60); do curl -fsS http://localhost:8002/readyz && exit 0; sleep 2; done
          exit 1
      - name: End-to-end query through the mock LLM
        run: |
          body=$(curl -fsS -H 'content-type: application/json' \
            -d '{"query":"How many customers are there?","use_cache":false}' http://localhost:8002/api/v1/query)
          echo "$body"
          echo "$body" | python -c 'import json,sys; r=json.load(sys.stdin); assert r["success"] and r["usage"]["prompt_tokens"] > 0, r'
      - name: Client-controlled mutations are refused (403)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' \
            -d '{"query":"delete all orders","allow_mutations":true}' http://localhost:8002/api/v1/query)
          test "$code" = "403"
      - name: Short load smoke (no errors at concurrency 10)
        run: |
          docker run --rm --network lumina_default lumina-sql-agent:local \
            python scripts/load_test.py --base-url http://api-loadtest:8000 --levels 10 --repeats 1 --min-requests 60 \
            | tee /tmp/load.txt
          grep -q 'err=  0.0%' /tmp/load.txt
      - name: Dump logs on failure
        if: failure()
        run: docker compose --profile loadtest logs --tail 200

  k8s-validation:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: lumina
      - name: Build and load image
        run: |
          docker build --target base -t lumina-sql-agent:local .
          kind load docker-image lumina-sql-agent:local --name lumina
      - name: Deploy (base manifests plus in-cluster mock LLM)
        run: |
          kubectl apply -f deploy/k8s/namespace.yaml
          kubectl -n lumina create configmap postgres-init --from-file=db/init --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -k deploy/k8s-testing
          kubectl -n lumina rollout status statefulset/postgres --timeout=180s
          kubectl -n lumina rollout status deployment/redis --timeout=120s
          kubectl -n lumina rollout status deployment/mock-llm --timeout=120s
          kubectl -n lumina rollout status deployment/lumina-api --timeout=180s
      - name: End-to-end query through the Service; API connects as the read-only role
        run: |
          kubectl -n lumina run e2e --rm -i --restart=Never --image=lumina-sql-agent:local \
            --image-pull-policy=IfNotPresent --command -- python -c "
          import httpx
          r = httpx.post('http://lumina-api:8000/api/v1/query', timeout=30,
                         json={'query': 'How many customers are there?', 'use_cache': False}).json()
          assert r['success'], r
          print(r['final_query'])"
          kubectl -n lumina exec statefulset/postgres -- \
            psql -U postgres -d lumina -tAc "select usename from pg_stat_activity where usename='lumina_reader' limit 1" \
            | grep -qx lumina_reader
      - name: NetworkPolicy blocks non-API pods from PostgreSQL
        run: |
          kubectl -n lumina run netcheck --rm -i --restart=Never --image=lumina-sql-agent:local \
            --image-pull-policy=IfNotPresent --command -- python -c "
          import socket
          s = socket.socket(); s.settimeout(3)
          try:
              s.connect(('postgres', 5432))
          except OSError:
              print('blocked')
          else:
              raise SystemExit('postgres reachable from a non-API pod')"
      - name: Rolling restart under traffic drops no requests
        run: |
          scripts/k8s_disruption_test.sh rollout | tee /tmp/rollout.json
          if ! grep -q '"error_rate": 0.0' /tmp/rollout.json; then
            echo "::error title=Rolling restart dropped requests::$(cat /tmp/rollout.json)"
            exit 1
          fi
      - name: Dump state on failure
        if: failure()
        run: |
          kubectl -n lumina get pods,svc,events
          kubectl -n lumina logs deployment/lumina-api --tail 100
