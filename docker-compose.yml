name: lumina

x-app-env: &app-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  # Least-privilege role from db/init/00_roles.sql; the superuser is only used by the postgres container.
  POSTGRES_USER: lumina_reader
  POSTGRES_PASSWORD: lumina_reader
  POSTGRES_DB: lumina
  REDIS_URL: redis://redis:6379/0
  DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  AWS_REGION: us-east-1

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lumina
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lumina"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: base
    image: lumina-sql-agent:local
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ui:
    image: lumina-sql-agent:local
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    env_file:
      - path: .env
        required: false
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    healthcheck:
      disable: true
    depends_on:
      - api

  dynamodb-local:
    image: amazon/dynamodb-local:2.5.3
    profiles: ["dynamodb"]
    ports:
      - "8001:8000"

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Load/resilience testing: an OpenAI-compatible mock LLM and a second API instance wired to it.
  mock-llm:
    image: lumina-sql-agent:local
    profiles: ["loadtest"]
    command: ["python", "scripts/mock_llm.py"]
    environment:
      MOCK_LLM_LATENCY_MS: ${MOCK_LLM_LATENCY_MS:-400}
    ports:
      - "9000:9000"
    healthcheck:
      disable: true

  api-loadtest:
    image: lumina-sql-agent:local
    profiles: ["loadtest"]
    # Same limits as the Kubernetes pod (deploy/k8s/api.yaml) so results are per-replica capacity.
    cpus: 1.0
    mem_limit: 512m
    environment:
      <<: *app-env
      OPENAI_API_KEY: mock-key
      OPENAI_BASE_URL: http://mock-llm:9000/v1
      OPENAI_MODEL: mock-gpt
      LOG_LEVEL: WARNING
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-16}
      MAX_QUEUED_REQUESTS: ${MAX_QUEUED_REQUESTS:-32}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-10}
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-llm:
        condition: service_started

  tests:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      <<: *app-env
      LUMINA_INTEGRATION: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
