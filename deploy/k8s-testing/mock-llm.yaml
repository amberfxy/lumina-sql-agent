apiVersion: v1
kind: Service
metadata:
  name: mock-llm
  labels:
    app.kubernetes.io/name: mock-llm
spec:
  selector:
    app.kubernetes.io/name: mock-llm
  ports:
    - name: http
      port: 9000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm
  labels:
    app.kubernetes.io/name: mock-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-llm
    spec:
      containers:
        - name: mock-llm
          image: lumina-sql-agent:local
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/mock_llm.py"]
          ports:
            - name: http
              containerPort: 9000
          readinessProbe:
            httpGet: { path: /admin/config, port: http }
            periodSeconds: 2
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 256Mi }
