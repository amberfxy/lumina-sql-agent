apiVersion: v1
kind: ConfigMap
metadata:
  name: lumina-config
data:
  LOG_LEVEL: INFO
  LLM_PROVIDER: openai
  OPENAI_MODEL: gpt-4o
  MAX_RETRY_ITERATIONS: "3"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: postgres
  POSTGRES_DB: lumina
  POSTGRES_POOL_SIZE: "5"
  POSTGRES_STATEMENT_TIMEOUT_MS: "15000"
  REDIS_URL: redis://redis:6379/0
---
# Placeholder values for local clusters only. In a real environment, source these
# from a secrets manager (e.g. External Secrets Operator or Sealed Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: lumina-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: postgres
  OPENAI_API_KEY: ""
